<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <!-- Logo Concept 1: Container + Shield -->
  <g id="logo-primary">
    <!-- Icon: Container with shield overlay -->
    <rect x="10" y="25" width="50" height="30" rx="3" fill="#2d5a3d"/>
    <rect x="10" y="25" width="50" height="30" rx="3" fill="none" stroke="#234830" stroke-width="2"/>
    <!-- Container ridges -->
    <line x1="20" y1="28" x2="20" y2="52" stroke="#234830" stroke-width="1.5"/>
    <line x1="30" y1="28" x2="30" y2="52" stroke="#234830" stroke-width="1.5"/>
    <line x1="40" y1="28" x2="40" y2="52" stroke="#234830" stroke-width="1.5"/>
    <line x1="50" y1="28" x2="50" y2="52" stroke="#234830" stroke-width="1.5"/>
    <!-- Door handles -->
    <rect x="54" y="32" width="3" height="6" rx="1" fill="#f8f6f3"/>
    <rect x="54" y="42" width="3" height="6" rx="1" fill="#f8f6f3"/>
    <!-- Shield accent (protection) -->
    <path d="M35 18 L45 22 L45 32 C45 38 35 42 35 42 C35 42 25 38 25 32 L25 22 Z" fill="#3a7550" opacity="0.9"/>
    <path d="M32 28 L35 31 L40 25" stroke="#f8f6f3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Text -->
    <text x="75" y="38" font-family="Georgia, serif" font-size="24" font-weight="400" fill="#1a1a1a">Magna Park</text>
    <text x="75" y="54" font-family="Arial, sans-serif" font-size="11" font-weight="500" fill="#4a5568" letter-spacing="0.1em">SELF STORAGE</text>
  </g>
</svg>
